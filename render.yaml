services:
  - type: web
    name: obscura-browser-engine
    runtime: docker
    plan: standard # Recommended for headless browser workloads (2 GB RAM)
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: OBSCURA_NETWORK_BODY_BUFFER_BYTES
        value: "104857600" # 100 MB buffer for high volume data streams
      - key: OBSCURA_STEALTH
        value: "on"
    healthCheckPath: /
    autoDeploy: true
