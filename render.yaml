services:
  - type: web
    name: headless-web-api
    runtime: docker
    plan: standard # Recommended for browser workloads (2 GB RAM)
    region: oregon
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PORT
        value: "10000"
      - key: OBSCURA_CDP_URL
        value: "ws://127.0.0.1:9222"
      - key: OBSCURA_NETWORK_BODY_BUFFER_BYTES
        value: "104857600"
    healthCheckPath: /health
    autoDeploy: true
